openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: medpaperhub Public API
  version: 1.0.0
  description: |
    Public read-only contract for the currently published catalog generation.
    Catalog endpoints return 503 with `catalog_not_published` until an operator
    explicitly publishes a generation. List cursors are signed opaque values and
    must be replayed with the same generation, filters, ranking window, and sort.

    Catalog fields that can lack evidence use an explicit `state` object:
    `known` includes `value`; `unknown` and `missing` never include `value`.
    Unknown `/api` routes return a 404 `route_not_found` Problem Details response.
    Non-GET requests to known routes return a 405 `method_not_allowed` Problem
    Details response with `Allow: GET`.
tags:
  - name: System
  - name: Biomedical Catalog
  - name: Papers
  - name: Taxonomy
  - name: Trends
  - name: Research Opportunities
paths:
  /:
    get:
      tags:
        - System
      operationId: getDiscovery
      summary: Discover the public API
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Stable discovery metadata for the public API.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check API process health
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/home:
    get:
      tags:
        - Biomedical Catalog
      operationId: getBiomedicalHome
      summary: Get the complete biomedical Home snapshot
      description: Returns the stored Home document from one immutable published generation.
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/BiomedicalHomeOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/subjects:
    get:
      tags:
        - Biomedical Catalog
      operationId: listBiomedicalSubjects
      summary: List accepted biomedical Subjects
      description: Uses the stable order `paper_count DESC, slug`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/BiomedicalSubjectListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/subjects/{slug}:
    get:
      tags:
        - Biomedical Catalog
      operationId: getBiomedicalSubject
      summary: Get one accepted biomedical Subject
      description: |
        `limit` and `cursor` paginate only the immutable
        `detail_payload.recent_papers.items` array.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/BiomedicalSubjectOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/journals:
    get:
      tags:
        - Biomedical Catalog
      operationId: listBiomedicalJournals
      summary: List accepted biomedical Journals
      description: Uses the stable order `paper_count DESC, slug`.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/BiomedicalJournalListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/journals/{slug}:
    get:
      tags:
        - Biomedical Catalog
      operationId: getBiomedicalJournal
      summary: Get one accepted biomedical Journal
      description: |
        `limit` and `cursor` paginate only the immutable
        `detail_payload.recent_papers.items` array.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/BiomedicalJournalOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/stats:
    get:
      tags:
        - System
      operationId: getStats
      summary: Get statistics from the current catalog generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/StatsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/papers:
    get:
      tags:
        - Papers
      operationId: listPapers
      summary: Search and filter papers in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperQuery"
        - $ref: "#/components/parameters/PublishedFrom"
        - $ref: "#/components/parameters/PublishedTo"
        - $ref: "#/components/parameters/PaperType"
        - $ref: "#/components/parameters/TopicFilter"
        - $ref: "#/components/parameters/MethodFilter"
        - $ref: "#/components/parameters/HasCode"
        - $ref: "#/components/parameters/HasData"
        - $ref: "#/components/parameters/HasBenchmark"
        - $ref: "#/components/parameters/PaperStatus"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/PaperSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/papers/{id}:
    get:
      tags:
        - Papers
      operationId: getPaper
      summary: Get one visible paper from the current generation
      description: |
        Malformed UUIDs, absent papers, and papers not visible in the published
        generation intentionally share the same 404 response.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperID"
      responses:
        "200":
          $ref: "#/components/responses/PaperDetailOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/topics:
    get:
      tags:
        - Taxonomy
      operationId: listTopics
      summary: List topics in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/topics/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getTopic
      summary: Get one visible topic from the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/TopicOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/methods:
    get:
      tags:
        - Taxonomy
      operationId: listMethods
      summary: List methods in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/methods/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getMethod
      summary: Get one visible method from the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/MethodOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/papers:
    get:
      tags:
        - Trends
      operationId: listPaperTrends
      summary: List persisted paper trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/topics:
    get:
      tags:
        - Trends
      operationId: listTopicTrends
      summary: List persisted topic trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/methods:
    get:
      tags:
        - Trends
      operationId: listMethodTrends
      summary: List persisted method trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/research-opportunities:
    get:
      tags:
        - Research Opportunities
      operationId: listResearchOpportunities
      summary: List persisted research opportunity analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/OpportunityStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/ResearchOpportunitiesOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional correlation ID matching the service's strict character set.
      schema:
        $ref: "#/components/schemas/RequestID"
    PaperID:
      name: id
      in: path
      required: true
      description: Paper UUID. Invalid UUID text is deliberately reported as resource_not_found.
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      description: Stable lowercase taxonomy slug.
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    PaperQuery:
      name: q
      in: query
      required: false
      description: Trimmed full-text query. Relevance sort requires this parameter.
      schema:
        type: string
        minLength: 1
        maxLength: 300
    PublishedFrom:
      name: published_from
      in: query
      required: false
      description: Inclusive RFC3339Nano lower bound.
      schema:
        type: string
        format: date-time
    PublishedTo:
      name: published_to
      in: query
      required: false
      description: Inclusive RFC3339Nano upper bound.
      schema:
        type: string
        format: date-time
    PaperType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperType"
    TopicFilter:
      name: topic
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    MethodFilter:
      name: method
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    HasCode:
      name: has_code
      in: query
      required: false
      schema:
        type: boolean
    HasData:
      name: has_data
      in: query
      required: false
      schema:
        type: boolean
    HasBenchmark:
      name: has_benchmark
      in: query
      required: false
      schema:
        type: boolean
    PaperStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperStatus"
    Source:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SourceName"
    PaperSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: published_at_desc
        enum:
          - relevance
          - published_at_desc
          - citations_desc
          - trend_desc
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Signed opaque cursor, at most 2048 bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TrendWindowDays:
      name: window_days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    OpportunityStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResearchOpportunityStatus"
  headers:
    XRequestID:
      description: Request correlation identifier generated or reused by the service.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
    XCatalogGeneration:
      description: UUID of the immutable catalog generation used for the response.
      required: true
      schema:
        type: string
        format: uuid
    AllowGET:
      description: The only method supported by the requested route.
      required: true
      schema:
        type: string
        const: GET
  responses:
    HealthOK:
      description: The API process is healthy. This does not imply a catalog is published.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    BiomedicalHomeOK:
      description: Complete Home document from the current biomedical generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HomeResponse"
    BiomedicalSubjectListOK:
      description: Accepted biomedical Subjects from the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubjectListResponse"
    BiomedicalSubjectOK:
      description: One accepted biomedical Subject with paginated recent papers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SubjectDetailResponse"
    BiomedicalJournalListOK:
      description: Accepted biomedical Journals from the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JournalListResponse"
    BiomedicalJournalOK:
      description: One accepted biomedical Journal with paginated recent papers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JournalDetailResponse"
    StatsOK:
      description: Statistics from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatsResponse"
    PaperListOK:
      description: Matching visible papers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperListResponse"
    PaperDetailOK:
      description: One visible paper.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperDetail"
    TopicListOK:
      description: Topics from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopicListResponse"
    TopicOK:
      description: One visible topic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Topic"
    MethodListOK:
      description: Methods from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodListResponse"
    MethodOK:
      description: One visible method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Method"
    PaperTrendsOK:
      description: Persisted paper trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    TopicTrendsOK:
      description: Persisted topic trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    MethodTrendsOK:
      description: Persisted method trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    ResearchOpportunitiesOK:
      description: Persisted research opportunities from the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResearchOpportunityListResponse"
    InvalidRequestIDProblem:
      description: X-Request-ID was present but invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidRequestID:
              value:
                type: urn:paper-hub:problem:invalid-request-id
                title: Bad Request
                status: 400
                code: invalid_request_id
                detail: X-Request-ID must match [A-Za-z0-9._:-]{1,255}.
                instance: /health
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    NotFoundProblem:
      description: The resource is absent or not visible in the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceNotFound:
              value:
                type: urn:paper-hub:problem:resource-not-found
                title: Not Found
                status: 404
                code: resource_not_found
                detail: The requested public catalog resource was not found.
                instance: /api/v1/papers/00000000-0000-0000-0000-000000000000
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    RouteNotFoundProblem:
      description: The requested /api route is not registered.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            routeNotFound:
              value:
                type: urn:paper-hub:problem:not-found
                title: Not Found
                status: 404
                code: route_not_found
                detail: The requested API resource was not found.
                instance: /api/v1/not-a-real-resource
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    MethodNotAllowedProblem:
      description: The known route only supports GET.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          $ref: "#/components/headers/AllowGET"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            methodNotAllowed:
              value:
                type: urn:paper-hub:problem:method-not-allowed
                title: Method Not Allowed
                status: 405
                code: method_not_allowed
                detail: The requested resource only supports GET.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    CursorConflictProblem:
      description: The cursor belongs to different filters, sort, window, or generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            cursorConflict:
              value:
                type: urn:paper-hub:problem:cursor-context-mismatch
                title: Conflict
                status: 409
                code: cursor_context_mismatch
                detail: The pagination cursor does not belong to the current generation and filters.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    ValidationProblem:
      description: Query validation failed or a cursor was malformed or had an invalid signature.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validationError:
              value:
                type: urn:paper-hub:problem:validation-error
                title: Unprocessable Content
                status: 422
                code: validation_error
                detail: The request parameters are invalid.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
            invalidCursor:
              value:
                type: urn:paper-hub:problem:invalid-cursor
                title: Unprocessable Content
                status: 422
                code: invalid_cursor
                detail: The pagination cursor is malformed or has an invalid signature.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    CatalogUnavailableProblem:
      description: No catalog generation has been published.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            catalogNotPublished:
              value:
                type: urn:paper-hub:problem:catalog-not-published
                title: Service Unavailable
                status: 503
                code: catalog_not_published
                detail: The public catalog has not been published.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    InternalProblem:
      description: The server could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            internalError:
              value:
                type: urn:paper-hub:problem:internal-error
                title: Internal Server Error
                status: 500
                code: internal_error
                detail: The server could not complete the request.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
  schemas:
    RequestID:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9._:-]{1,255}$"
    TaxonomySlug:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    CatalogValueState:
      type: string
      enum:
        - known
        - unknown
        - missing
    UnknownCatalogValue:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          const: unknown
    MissingCatalogValue:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          const: missing
    StringCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: string
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    DateTimeCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: string
              format: date-time
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    BooleanCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: boolean
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    IntegerCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: integer
              minimum: 0
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    RatioCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
              minimum: 0
              maximum: 1
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    NumberCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    PaperTypeCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              $ref: "#/components/schemas/PaperType"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    InsufficientEvidenceCatalogValue:
      type: object
      additionalProperties: false
      required:
        - state
        - reason
      properties:
        state:
          type: string
          const: insufficient_evidence
        reason:
          type: string
          minLength: 1
    CitationVelocityCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
        - $ref: "#/components/schemas/InsufficientEvidenceCatalogValue"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    CitationPercentileCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
              minimum: 0
              maximum: 100
        - $ref: "#/components/schemas/InsufficientEvidenceCatalogValue"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    CitationVelocityKnownEvidence:
      type: object
      additionalProperties: false
      required:
        - state
        - window_days
        - current_snapshot_id
        - baseline_snapshot_id
        - elapsed_days
      properties:
        state:
          type: string
          const: known
        window_days:
          type: integer
          minimum: 1
          maximum: 3650
        current_snapshot_id:
          type: string
          format: uuid
        baseline_snapshot_id:
          type: string
          format: uuid
        elapsed_days:
          type: number
          exclusiveMinimum: 0
    CitationVelocityInsufficientEvidence:
      type: object
      additionalProperties: false
      required:
        - state
        - window_days
        - reason
        - missing
      properties:
        state:
          type: string
          const: insufficient_evidence
        window_days:
          type: integer
          minimum: 1
          maximum: 3650
        reason:
          type: string
          minLength: 1
        missing:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    CitationVelocityEvidence:
      oneOf:
        - $ref: "#/components/schemas/CitationVelocityKnownEvidence"
        - $ref: "#/components/schemas/CitationVelocityInsufficientEvidence"
    CitationPercentileKnownEvidence:
      type: object
      additionalProperties: false
      required:
        - state
        - citation_snapshot_id
        - subject_version_id
        - subject_id
        - publication_year
        - publication_type_id
        - cohort_key
        - cohort_size
        - minimum_cohort_size
        - midrank
        - supporting_work_ids
      properties:
        state:
          type: string
          const: known
        citation_snapshot_id:
          type: string
          format: uuid
        subject_version_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        publication_year:
          type: integer
          minimum: 1900
          maximum: 3000
        publication_type_id:
          type: string
          format: uuid
        cohort_key:
          type: string
          minLength: 1
        cohort_size:
          type: integer
          minimum: 1
        minimum_cohort_size:
          type: integer
          minimum: 2
        midrank:
          type: number
          minimum: 1
        supporting_work_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CitationPercentileInsufficientEvidence:
      type: object
      additionalProperties: false
      required:
        - state
        - citation_snapshot_id
        - subject_version_id
        - subject_id
        - publication_year
        - publication_type_id
        - cohort_key
        - cohort_size
        - minimum_cohort_size
        - reason
        - supporting_work_ids
      properties:
        state:
          type: string
          const: insufficient_evidence
        citation_snapshot_id:
          type: string
          format: uuid
        subject_version_id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
        publication_year:
          type: integer
          minimum: 1900
          maximum: 3000
        publication_type_id:
          type: string
          format: uuid
        cohort_key:
          type: string
          minLength: 1
        cohort_size:
          type: integer
          minimum: 1
        minimum_cohort_size:
          type: integer
          minimum: 2
        reason:
          type: string
          minLength: 1
        supporting_work_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CitationPercentileEvidence:
      oneOf:
        - $ref: "#/components/schemas/CitationPercentileKnownEvidence"
        - $ref: "#/components/schemas/CitationPercentileInsufficientEvidence"
    CitationAnalysisEvidence:
      type: object
      additionalProperties: false
      required:
        - analysis_run_id
        - source
        - as_of
        - generated_at
        - formula_version
        - source_revision
        - velocity
        - percentile
      properties:
        analysis_run_id:
          type: string
          format: uuid
        source:
          type: string
          minLength: 1
        as_of:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        formula_version:
          type: string
          minLength: 1
        source_revision:
          type: string
          pattern: "^[0-9a-f]{64}$"
        velocity:
          $ref: "#/components/schemas/CitationVelocityEvidence"
        percentile:
          $ref: "#/components/schemas/CitationPercentileEvidence"
    CitationAnalysisEvidenceCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              $ref: "#/components/schemas/CitationAnalysisEvidence"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    CitationSnapshot:
      type: object
      additionalProperties: false
      required:
        - source
        - observed_at
        - count
        - source_record_id
        - ingestion_job_id
        - retrieved_at
        - coverage
        - definition_version
        - dataset_version
      properties:
        source:
          type: string
          minLength: 1
        observed_at:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 0
        source_record_id:
          type: string
          format: uuid
        ingestion_job_id:
          type: string
          format: uuid
        retrieved_at:
          type: string
          format: date-time
        coverage:
          type: number
          minimum: 0
          maximum: 1
        definition_version:
          type: string
          minLength: 1
        dataset_version:
          type: string
          minLength: 1
    CitationSnapshotsCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/CitationSnapshot"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - api_version
        - health
      properties:
        service:
          type: string
          const: medpaperhub-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        health:
          type: string
          const: /health
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: medpaperhub-api
    StringArrayCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: array
              items:
                type: string
                minLength: 1
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    AnalysisMetadata:
      type: object
      additionalProperties: false
      required:
        - coverage_ratio
        - generated_at
        - missing_signals
        - sample_size
        - sources
        - window_days
      properties:
        analysis_run_id:
          type: string
          format: uuid
        analysis_type:
          type: string
          minLength: 1
        baseline_window_days:
          type: integer
          minimum: 0
        cohort_revision:
          type: string
          pattern: "^[0-9a-f]{64}$"
        coverage_ratio:
          $ref: "#/components/schemas/RatioCatalogValue"
        formula_version:
          $ref: "#/components/schemas/StringCatalogValue"
        generated_at:
          $ref: "#/components/schemas/StringCatalogValue"
        missing_signals:
          type: array
          items:
            oneOf:
              - type: string
                minLength: 1
              - $ref: "#/components/schemas/MissingSignal"
        recent_window_days:
          type: integer
          minimum: 0
        sample_size:
          $ref: "#/components/schemas/IntegerCatalogValue"
        sources:
          $ref: "#/components/schemas/StringArrayCatalogValue"
        window_days:
          $ref: "#/components/schemas/IntegerCatalogValue"
    ConfidenceInterval:
      type: object
      additionalProperties: false
      required:
        - lower
        - upper
      properties:
        lower:
          type: number
        upper:
          type: number
    SubjectTrendEstimate:
      type: object
      additionalProperties: false
      required:
        - adjusted_p_value
        - baseline_count
        - confidence_interval
        - estimate
        - model_family
        - p_value
        - recent_count
        - independent_journal_count
        - independent_team_count
      properties:
        adjusted_p_value:
          $ref: "#/components/schemas/NumberCatalogValue"
        baseline_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        confidence_interval:
          $ref: "#/components/schemas/ConfidenceInterval"
        estimate:
          $ref: "#/components/schemas/NumberCatalogValue"
        model_family:
          type: string
          minLength: 1
        p_value:
          $ref: "#/components/schemas/NumberCatalogValue"
        independent_journal_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        independent_team_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        recent_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        label:
          type: string
          minLength: 1
        subject:
          $ref: "#/components/schemas/TaxonomyReference"
    SubjectTrendCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
        - items
      properties:
        analysis:
          $ref: "#/components/schemas/AnalysisMetadata"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubjectTrendEstimate"
    CitationMomentumItem:
      type: object
      additionalProperties: false
