openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Paper Research Hub Public API
  version: 1.0.0
  description: |
    Public read-only contract for Paper Research Hub. List cursors are stable,
    opaque values and must be replayed with the same filters and sort order that
    produced them.
tags:
  - name: System
  - name: Papers
  - name: Taxonomy
  - name: Trends
  - name: Research Opportunities
paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check API health
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/stats:
    get:
      tags:
        - System
      operationId: getStats
      summary: Get portal-wide statistics
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/StatsOK"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/papers:
    get:
      tags:
        - Papers
      operationId: listPapers
      summary: Search and filter papers
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperQuery"
        - $ref: "#/components/parameters/PublishedFrom"
        - $ref: "#/components/parameters/PublishedTo"
        - $ref: "#/components/parameters/PaperType"
        - $ref: "#/components/parameters/TopicFilter"
        - $ref: "#/components/parameters/MethodFilter"
        - $ref: "#/components/parameters/HasCode"
        - $ref: "#/components/parameters/HasData"
        - $ref: "#/components/parameters/HasBenchmark"
        - $ref: "#/components/parameters/PaperStatus"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/PaperSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperListOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/papers/{id}:
    get:
      tags:
        - Papers
      operationId: getPaper
      summary: Get one paper
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperID"
      responses:
        "200":
          $ref: "#/components/responses/PaperDetailOK"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/topics:
    get:
      tags:
        - Taxonomy
      operationId: listTopics
      summary: List research topics
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicListOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/topics/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getTopic
      summary: Get one research topic
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/TopicOK"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/methods:
    get:
      tags:
        - Taxonomy
      operationId: listMethods
      summary: List research methods
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodListOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/methods/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getMethod
      summary: Get one research method
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/MethodOK"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/trends/papers:
    get:
      tags:
        - Trends
      operationId: listPaperTrends
      summary: Rank trending papers
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperTrendsOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/trends/topics:
    get:
      tags:
        - Trends
      operationId: listTopicTrends
      summary: Rank trending topics
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicTrendsOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/trends/methods:
    get:
      tags:
        - Trends
      operationId: listMethodTrends
      summary: Rank trending methods
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodTrendsOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
  /api/v1/research-opportunities:
    get:
      tags:
        - Research Opportunities
      operationId: listResearchOpportunities
      summary: List evidence-backed research opportunities
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/OpportunityStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/ResearchOpportunitiesOK"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        default:
          $ref: "#/components/responses/DefaultProblem"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client request correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestID"
    PaperID:
      name: id
      in: path
      required: true
      description: Paper UUID.
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      description: Stable lowercase taxonomy slug.
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    PaperQuery:
      name: q
      in: query
      required: false
      description: Full-text query across titles, abstracts, authors, and identifiers.
      schema:
        type: string
        minLength: 1
        maxLength: 300
    PublishedFrom:
      name: published_from
      in: query
      required: false
      description: Inclusive lower bound for publication time.
      schema:
        type: string
        format: date-time
    PublishedTo:
      name: published_to
      in: query
      required: false
      description: Inclusive upper bound for publication time.
      schema:
        type: string
        format: date-time
    PaperType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperType"
    TopicFilter:
      name: topic
      in: query
      required: false
      description: Topic slug.
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    MethodFilter:
      name: method
      in: query
      required: false
      description: Method slug.
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    HasCode:
      name: has_code
      in: query
      required: false
      schema:
        type: boolean
    HasData:
      name: has_data
      in: query
      required: false
      schema:
        type: boolean
    HasBenchmark:
      name: has_benchmark
      in: query
      required: false
      schema:
        type: boolean
    PaperStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperStatus"
    Source:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SourceName"
    PaperSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: published_at_desc
        enum:
          - relevance
          - published_at_desc
          - citations_desc
          - trend_desc
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Stable opaque pagination cursor. Clients must not parse or alter it and
        must replay it with the same filters, ranking window, and sort order.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TrendWindowDays:
      name: window_days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    OpportunityStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResearchOpportunityStatus"
  headers:
    XRequestID:
      description: Request correlation identifier generated or reused by the service.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
  responses:
    HealthOK:
      description: API is healthy.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    StatsOK:
      description: Portal statistics.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatsResponse"
    PaperListOK:
      description: Matching papers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperListResponse"
    PaperDetailOK:
      description: Paper details.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperDetail"
    TopicListOK:
      description: Research topics.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopicListResponse"
    TopicOK:
      description: Research topic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Topic"
    MethodListOK:
      description: Research methods.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodListResponse"
    MethodOK:
      description: Research method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Method"
    PaperTrendsOK:
      description: Ranked paper trends.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperTrendListResponse"
    TopicTrendsOK:
      description: Ranked topic trends.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopicTrendListResponse"
    MethodTrendsOK:
      description: Ranked method trends.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodTrendListResponse"
    ResearchOpportunitiesOK:
      description: Evidence-backed research opportunities.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResearchOpportunityListResponse"
    ValidationProblem:
      description: Request parameters failed validation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFoundProblem:
      description: The requested resource does not exist.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    CursorConflictProblem:
      description: The cursor cannot be used with the supplied filters, window, or sort order.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    DefaultProblem:
      description: RFC 9457 problem response.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    RequestID:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9._:-]{1,255}$"
    TaxonomySlug:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    TaxonomyItem:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - description
        - paper_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "#/components/schemas/TaxonomySlug"
        name:
          type: string
          minLength: 1
        description:
          type: string
        paper_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: paper-hub-api
    StatsResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - papers_total
        - papers_last_7_days
        - topics_total
        - methods_total
        - with_code_ratio
        - with_data_ratio
        - with_benchmark_ratio
      properties:
        generated_at:
          type: string
          format: date-time
        papers_total:
          type: integer
          minimum: 0
        papers_last_7_days:
          type: integer
          minimum: 0
        topics_total:
          type: integer
          minimum: 0
        methods_total:
          type: integer
          minimum: 0
        with_code_ratio:
          $ref: "#/components/schemas/Ratio"
        with_data_ratio:
          $ref: "#/components/schemas/Ratio"
        with_benchmark_ratio:
          $ref: "#/components/schemas/Ratio"
    PaperListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
        - facets
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
        facets:
          $ref: "#/components/schemas/Facets"
    TopicListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MethodListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Method"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PaperTrendListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - window_days
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        window_days:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperTrend"
        pagination:
          $ref: "#/components/schemas/Pagination"
    TopicTrendListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - window_days
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        window_days:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopicTrend"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MethodTrendListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - window_days
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        window_days:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/MethodTrend"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ResearchOpportunityListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - formula_version
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        formula_version:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResearchOpportunity"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PaperSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - abstract_snippet
        - published_at
        - type
        - status
        - authors
        - topics
        - methods
        - external_identifiers
        - source_provenance
        - has_code
        - has_data
        - has_benchmark
        - ranking
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        abstract_snippet:
          type: string
        published_at:
          type: string
          format: date-time
        type:
          $ref: "#/components/schemas/PaperType"
        status:
          $ref: "#/components/schemas/PaperStatus"
        authors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Author"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/Method"
        external_identifiers:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentifier"
        source_provenance:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceProvenance"
        has_code:
          type: boolean
        has_data:
          type: boolean
        has_benchmark:
          type: boolean
        ranking:
          $ref: "#/components/schemas/RankingMetadata"
    PaperDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - abstract
        - published_at
        - type
        - status
        - authors
        - institutions
        - topics
        - methods
        - external_identifiers
        - source_provenance
        - datasets
        - benchmarks
        - models
        - code_repositories
        - metric_snapshots
        - ranking
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        abstract:
          type: string
        published_at:
          type: string
          format: date-time
        type:
          $ref: "#/components/schemas/PaperType"
        status:
          $ref: "#/components/schemas/PaperStatus"
        authors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Author"
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/Institution"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/Method"
        external_identifiers:
          type: array
          items:
            $ref: "#/components/schemas/ExternalIdentifier"
        source_provenance:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceProvenance"
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/Benchmark"
        models:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        code_repositories:
          type: array
          items:
            $ref: "#/components/schemas/CodeRepository"
        metric_snapshots:
          type: array
          items:
            $ref: "#/components/schemas/MetricSnapshot"
        ranking:
          $ref: "#/components/schemas/RankingMetadata"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Author:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - institutions
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
        given_name:
          type: string
        family_name:
          type: string
        orcid:
          type: string
          pattern: "^0000-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]$"
        institutions:
          type: array
          items:
            $ref: "#/components/schemas/Institution"
    Institution:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        ror_id:
          type: string
          pattern: "^0[a-hj-km-np-tv-z0-9]{6}[0-9]{2}$"
        country_code:
          type: string
          pattern: "^[A-Z]{2}$"
        website:
          type: string
          format: uri
    ExternalIdentifier:
      type: object
      additionalProperties: false
      required:
        - scheme
        - value
      properties:
        scheme:
          type: string
          enum:
            - doi
            - arxiv
            - pmid
            - openalex
            - semantic_scholar
        value:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
    SourceProvenance:
      type: object
      additionalProperties: false
      required:
        - source
        - source_record_id
        - ingested_at
        - last_seen_at
      properties:
        source:
