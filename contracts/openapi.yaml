          format: uuid
        slug:
          $ref: "#/components/schemas/TaxonomySlug"
        title:
          type: string
          minLength: 1
        aliases:
          type: array
          items:
            type: string
            minLength: 1
        categories:
          type: array
          items:
            $ref: "#/components/schemas/JournalMetricCategory"
        eissn:
          $ref: "#/components/schemas/StringCatalogValue"
        issn_l:
          $ref: "#/components/schemas/StringCatalogValue"
        issns:
          type: array
          items:
            type: string
            minLength: 1
        jcr_metric_year:
          type: integer
          minimum: 1900
          maximum: 3000
        jif:
          $ref: "#/components/schemas/NumberCatalogValue"
        paper_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        publisher:
          $ref: "#/components/schemas/StringCatalogValue"
        taxonomy_version:
          type: string
          minLength: 1
    JournalActivityItem:
      type: object
      additionalProperties: false
      required:
        - journal
        - paper_count
        - publication_change_ratio
      properties:
        journal:
          $ref: "#/components/schemas/JournalSummary"
        paper_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        publication_change_ratio:
          $ref: "#/components/schemas/NumberCatalogValue"
    JournalActivityCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
        - items
      properties:
        analysis:
          $ref: "#/components/schemas/AnalysisMetadata"
        items:
          type: array
          items:
            $ref: "#/components/schemas/JournalActivityItem"
    PaperAnalysisCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
        - items
      properties:
        analysis:
          $ref: "#/components/schemas/AnalysisMetadata"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperSummary"
    ResearchOpportunityAnalysisCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
        - items
      properties:
        analysis:
          $ref: "#/components/schemas/AnalysisMetadata"
