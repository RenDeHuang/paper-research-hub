openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: medpaperhub Public API
  version: 1.0.0
  description: |
    Public read-only contract for the currently published catalog generation.
    Catalog endpoints return 503 with `catalog_not_published` until an operator
    explicitly publishes a generation. List cursors are signed opaque values and
    must be replayed with the same generation, filters, ranking window, and sort.

    Catalog fields that can lack evidence use an explicit `state` object:
    `known` includes `value`; `unknown` and `missing` never include `value`.
    Unknown `/api` routes return a 404 `route_not_found` Problem Details response.
    Non-GET requests to known routes return a 405 `method_not_allowed` Problem
    Details response with `Allow: GET`.
tags:
  - name: System
  - name: Papers
  - name: Taxonomy
  - name: Trends
  - name: Research Opportunities
paths:
  /:
    get:
      tags:
        - System
      operationId: getDiscovery
      summary: Discover the public API
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: Stable discovery metadata for the public API.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryResponse"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check API process health
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/HealthOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/stats:
    get:
      tags:
        - System
      operationId: getStats
      summary: Get statistics from the current catalog generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          $ref: "#/components/responses/StatsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/papers:
    get:
      tags:
        - Papers
      operationId: listPapers
      summary: Search and filter papers in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperQuery"
        - $ref: "#/components/parameters/PublishedFrom"
        - $ref: "#/components/parameters/PublishedTo"
        - $ref: "#/components/parameters/PaperType"
        - $ref: "#/components/parameters/TopicFilter"
        - $ref: "#/components/parameters/MethodFilter"
        - $ref: "#/components/parameters/HasCode"
        - $ref: "#/components/parameters/HasData"
        - $ref: "#/components/parameters/HasBenchmark"
        - $ref: "#/components/parameters/PaperStatus"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/PaperSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/papers/{id}:
    get:
      tags:
        - Papers
      operationId: getPaper
      summary: Get one visible paper from the current generation
      description: |
        Malformed UUIDs, absent papers, and papers not visible in the published
        generation intentionally share the same 404 response.
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/PaperID"
      responses:
        "200":
          $ref: "#/components/responses/PaperDetailOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/topics:
    get:
      tags:
        - Taxonomy
      operationId: listTopics
      summary: List topics in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/topics/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getTopic
      summary: Get one visible topic from the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/TopicOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/methods:
    get:
      tags:
        - Taxonomy
      operationId: listMethods
      summary: List methods in the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodListOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/methods/{slug}:
    get:
      tags:
        - Taxonomy
      operationId: getMethod
      summary: Get one visible method from the current generation
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          $ref: "#/components/responses/MethodOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/papers:
    get:
      tags:
        - Trends
      operationId: listPaperTrends
      summary: List persisted paper trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/PaperTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/topics:
    get:
      tags:
        - Trends
      operationId: listTopicTrends
      summary: List persisted topic trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/TopicTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/trends/methods:
    get:
      tags:
        - Trends
      operationId: listMethodTrends
      summary: List persisted method trend analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/TrendWindowDays"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/MethodTrendsOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
  /api/v1/research-opportunities:
    get:
      tags:
        - Research Opportunities
      operationId: listResearchOpportunities
      summary: List persisted research opportunity analysis
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/OpportunityStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          $ref: "#/components/responses/ResearchOpportunitiesOK"
        "400":
          $ref: "#/components/responses/InvalidRequestIDProblem"
        "405":
          $ref: "#/components/responses/MethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/CursorConflictProblem"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "503":
          $ref: "#/components/responses/CatalogUnavailableProblem"
        default:
          $ref: "#/components/responses/InternalProblem"
components:
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional correlation ID matching the service's strict character set.
      schema:
        $ref: "#/components/schemas/RequestID"
    PaperID:
      name: id
      in: path
      required: true
      description: Paper UUID. Invalid UUID text is deliberately reported as resource_not_found.
      schema:
        type: string
        format: uuid
    Slug:
      name: slug
      in: path
      required: true
      description: Stable lowercase taxonomy slug.
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    PaperQuery:
      name: q
      in: query
      required: false
      description: Trimmed full-text query. Relevance sort requires this parameter.
      schema:
        type: string
        minLength: 1
        maxLength: 300
    PublishedFrom:
      name: published_from
      in: query
      required: false
      description: Inclusive RFC3339Nano lower bound.
      schema:
        type: string
        format: date-time
    PublishedTo:
      name: published_to
      in: query
      required: false
      description: Inclusive RFC3339Nano upper bound.
      schema:
        type: string
        format: date-time
    PaperType:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperType"
    TopicFilter:
      name: topic
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    MethodFilter:
      name: method
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TaxonomySlug"
    HasCode:
      name: has_code
      in: query
      required: false
      schema:
        type: boolean
    HasData:
      name: has_data
      in: query
      required: false
      schema:
        type: boolean
    HasBenchmark:
      name: has_benchmark
      in: query
      required: false
      schema:
        type: boolean
    PaperStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PaperStatus"
    Source:
      name: source
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SourceName"
    PaperSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: published_at_desc
        enum:
          - relevance
          - published_at_desc
          - citations_desc
          - trend_desc
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Signed opaque cursor, at most 2048 bytes.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TrendWindowDays:
      name: window_days
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 365
        default: 30
    OpportunityStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ResearchOpportunityStatus"
  headers:
    XRequestID:
      description: Request correlation identifier generated or reused by the service.
      required: true
      schema:
        $ref: "#/components/schemas/RequestID"
    XCatalogGeneration:
      description: UUID of the immutable catalog generation used for the response.
      required: true
      schema:
        type: string
        format: uuid
    AllowGET:
      description: The only method supported by the requested route.
      required: true
      schema:
        type: string
        const: GET
  responses:
    HealthOK:
      description: The API process is healthy. This does not imply a catalog is published.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    StatsOK:
      description: Statistics from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatsResponse"
    PaperListOK:
      description: Matching visible papers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperListResponse"
    PaperDetailOK:
      description: One visible paper.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaperDetail"
    TopicListOK:
      description: Topics from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TopicListResponse"
    TopicOK:
      description: One visible topic.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Topic"
    MethodListOK:
      description: Methods from the current catalog generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodListResponse"
    MethodOK:
      description: One visible method.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Method"
    PaperTrendsOK:
      description: Persisted paper trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    TopicTrendsOK:
      description: Persisted topic trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    MethodTrendsOK:
      description: Persisted method trend rows for the selected window.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TrendListResponse"
    ResearchOpportunitiesOK:
      description: Persisted research opportunities from the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        X-Catalog-Generation:
          $ref: "#/components/headers/XCatalogGeneration"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResearchOpportunityListResponse"
    InvalidRequestIDProblem:
      description: X-Request-ID was present but invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            invalidRequestID:
              value:
                type: urn:paper-hub:problem:invalid-request-id
                title: Bad Request
                status: 400
                code: invalid_request_id
                detail: X-Request-ID must match [A-Za-z0-9._:-]{1,255}.
                instance: /health
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    NotFoundProblem:
      description: The resource is absent or not visible in the current generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            resourceNotFound:
              value:
                type: urn:paper-hub:problem:resource-not-found
                title: Not Found
                status: 404
                code: resource_not_found
                detail: The requested public catalog resource was not found.
                instance: /api/v1/papers/00000000-0000-0000-0000-000000000000
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    RouteNotFoundProblem:
      description: The requested /api route is not registered.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            routeNotFound:
              value:
                type: urn:paper-hub:problem:not-found
                title: Not Found
                status: 404
                code: route_not_found
                detail: The requested API resource was not found.
                instance: /api/v1/not-a-real-resource
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    MethodNotAllowedProblem:
      description: The known route only supports GET.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
        Allow:
          $ref: "#/components/headers/AllowGET"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            methodNotAllowed:
              value:
                type: urn:paper-hub:problem:method-not-allowed
                title: Method Not Allowed
                status: 405
                code: method_not_allowed
                detail: The requested resource only supports GET.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    CursorConflictProblem:
      description: The cursor belongs to different filters, sort, window, or generation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            cursorConflict:
              value:
                type: urn:paper-hub:problem:cursor-context-mismatch
                title: Conflict
                status: 409
                code: cursor_context_mismatch
                detail: The pagination cursor does not belong to the current generation and filters.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    ValidationProblem:
      description: Query validation failed or a cursor was malformed or had an invalid signature.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            validationError:
              value:
                type: urn:paper-hub:problem:validation-error
                title: Unprocessable Content
                status: 422
                code: validation_error
                detail: The request parameters are invalid.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
            invalidCursor:
              value:
                type: urn:paper-hub:problem:invalid-cursor
                title: Unprocessable Content
                status: 422
                code: invalid_cursor
                detail: The pagination cursor is malformed or has an invalid signature.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    CatalogUnavailableProblem:
      description: No catalog generation has been published.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            catalogNotPublished:
              value:
                type: urn:paper-hub:problem:catalog-not-published
                title: Service Unavailable
                status: 503
                code: catalog_not_published
                detail: The public catalog has not been published.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
    InternalProblem:
      description: The server could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
          examples:
            internalError:
              value:
                type: urn:paper-hub:problem:internal-error
                title: Internal Server Error
                status: 500
                code: internal_error
                detail: The server could not complete the request.
                instance: /api/v1/papers
                request_id: 6f9619ff8b86d011bb2d9ba3dfbcd2fd
  schemas:
    RequestID:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9._:-]{1,255}$"
    TaxonomySlug:
      type: string
      minLength: 1
      maxLength: 120
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    CatalogValueState:
      type: string
      enum:
        - known
        - unknown
        - missing
    UnknownCatalogValue:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          const: unknown
    MissingCatalogValue:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          type: string
          const: missing
    StringCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: string
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    DateTimeCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: string
              format: date-time
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    BooleanCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: boolean
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    IntegerCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: integer
              minimum: 0
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    RatioCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
              minimum: 0
              maximum: 1
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    NumberCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: number
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    PaperTypeCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              $ref: "#/components/schemas/PaperType"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required:
        - service
        - status
        - api_version
        - health
      properties:
        service:
          type: string
          const: medpaperhub-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        health:
          type: string
          const: /health
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: medpaperhub-api
    StatsResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - formula_version
        - papers_total
        - papers_last_7_days
        - topics_total
        - methods_total
        - with_code_ratio
        - with_data_ratio
        - with_benchmark_ratio
      properties:
        generated_at:
          type: string
          format: date-time
        formula_version:
          type: string
          minLength: 1
        papers_total:
          $ref: "#/components/schemas/IntegerCatalogValue"
        papers_last_7_days:
          $ref: "#/components/schemas/IntegerCatalogValue"
        topics_total:
          $ref: "#/components/schemas/IntegerCatalogValue"
        methods_total:
          $ref: "#/components/schemas/IntegerCatalogValue"
        with_code_ratio:
          $ref: "#/components/schemas/RatioCatalogValue"
        with_data_ratio:
          $ref: "#/components/schemas/RatioCatalogValue"
        with_benchmark_ratio:
          $ref: "#/components/schemas/RatioCatalogValue"
    PaperListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
        - facets
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaperSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
        facets:
          $ref: "#/components/schemas/Facets"
    TopicListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Topic"
        pagination:
          $ref: "#/components/schemas/Pagination"
    MethodListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Method"
        pagination:
          $ref: "#/components/schemas/Pagination"
    TrendListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - window_days
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        window_days:
          type: integer
          minimum: 1
          maximum: 365
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrendItem"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ResearchOpportunityListResponse:
      type: object
      additionalProperties: false
      required:
        - generated_at
        - formula_version
        - items
        - pagination
      properties:
        generated_at:
          type: string
          format: date-time
        formula_version:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResearchOpportunity"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PaperSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - published_at
        - type
        - has_code
        - has_data
        - has_benchmark
      properties:
        id:
          type: string
          format: uuid
        canonical_key:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/PaperStatus"
        published_at:
          $ref: "#/components/schemas/DateTimeCatalogValue"
        type:
          $ref: "#/components/schemas/PaperTypeCatalogValue"
        abstract:
          $ref: "#/components/schemas/StringCatalogValue"
        has_code:
          $ref: "#/components/schemas/BooleanCatalogValue"
        has_data:
          $ref: "#/components/schemas/BooleanCatalogValue"
        has_benchmark:
          $ref: "#/components/schemas/BooleanCatalogValue"
        citation_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        trend_score:
          $ref: "#/components/schemas/NumberCatalogValue"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyReference"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomyReference"
        authors:
          type: array
          items:
            $ref: "#/components/schemas/AuthorReference"
        curation:
          $ref: "#/components/schemas/CurationCatalogValue"
        source_provenance:
          $ref: "#/components/schemas/SourceProvenanceCatalogValue"
    PaperDetail:
      $ref: "#/components/schemas/PaperSummary"
    TaxonomyReference:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "#/components/schemas/TaxonomySlug"
        name:
          type: string
          minLength: 1
    TaxonomyItem:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - description
        - paper_count
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "#/components/schemas/TaxonomySlug"
        name:
          type: string
          minLength: 1
        description:
          $ref: "#/components/schemas/StringCatalogValue"
        paper_count:
          type: integer
          minimum: 0
        paper_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Topic:
      $ref: "#/components/schemas/TaxonomyItem"
    Method:
      $ref: "#/components/schemas/TaxonomyItem"
    AuthorReference:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - position
        - is_corresponding
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        orcid:
          type: string
          minLength: 1
        institution_id:
          type: string
          format: uuid
        institution_name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 1
        is_corresponding:
          type: boolean
    SourceProvenance:
      type: object
      additionalProperties: false
      required:
        - source
        - event_key
        - source_record_id
        - source_time
        - normalization_policy_version
        - scope_policy_version
        - projection_policy_version
      properties:
        source:
          type: string
          minLength: 1
        event_key:
          type: string
          minLength: 1
        source_record_id:
          type: string
          format: uuid
        source_time:
          type: string
          format: date-time
        normalization_policy_version:
          type: string
          minLength: 1
        scope_policy_version:
          type: string
          minLength: 1
        projection_policy_version:
          type: string
          minLength: 1
    SourceProvenanceCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/SourceProvenance"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    CurationPayload:
      type: object
      additionalProperties: false
      required:
        - decision
        - matched_rules
        - evidence
        - metric_year
        - policy_name
        - policy_version
        - assessed_at
      properties:
        decision:
          type: string
          enum:
            - accepted
            - rejected
            - not_applicable
        matched_rules: {}
        evidence: {}
        metric_year:
          type: integer
          minimum: 1
        policy_name:
          type: string
          minLength: 1
        policy_version:
          type: integer
          minimum: 1
        assessed_at:
          type: string
          format: date-time
    CurationCatalogValue:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
            - value
          properties:
            state:
              type: string
              const: known
            value:
              $ref: "#/components/schemas/CurationPayload"
        - $ref: "#/components/schemas/UnknownCatalogValue"
        - $ref: "#/components/schemas/MissingCatalogValue"
    Pagination:
      type: object
      additionalProperties: false
      required:
        - limit
        - total
        - next_cursor
        - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        next_cursor:
          description: Signed opaque cursor for the next page, or null at the end.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 2048
        has_more:
          type: boolean
    Facets:
      type: object
      additionalProperties: false
      required:
        - paper_types
        - topics
        - methods
        - statuses
        - sources
      properties:
        paper_types:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        topics:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/FacetBucket"
    FacetBucket:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - count
      properties:
        key:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 0
    TrendItem:
      type: object
      additionalProperties: false
      required:
        - rank
        - score
        - subject_id
        - ranking
      properties:
        rank:
          type: integer
          minimum: 1
        score:
          type: number
        rank_change:
          type: integer
        subject_id:
          type: string
          format: uuid
        paper:
          $ref: "#/components/schemas/PaperSummary"
        topic:
          $ref: "#/components/schemas/Topic"
        method:
          $ref: "#/components/schemas/Method"
        ranking:
          $ref: "#/components/schemas/RankingMetadata"
    RankingMetadata:
      type: object
      additionalProperties: false
      required:
        - missing_signals
      properties:
        formula_version:
          type: string
          minLength: 1
        window_days:
          type: integer
          minimum: 1
        generated_at:
          type: string
          format: date-time
        coverage:
          $ref: "#/components/schemas/RatioCatalogValue"
        missing_signals:
          type: array
          items:
            oneOf:
              - type: string
                minLength: 1
              - $ref: "#/components/schemas/MissingSignal"
        confidence:
          $ref: "#/components/schemas/RatioCatalogValue"
    MissingSignal:
      type: object
      additionalProperties: false
      required:
        - signal
      properties:
        signal:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        affected_entity_ids:
          type: array
          items:
            type: string
            format: uuid
    ResearchOpportunity:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - status
        - evidence_ids
        - formula_version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/ResearchOpportunityStatus"
        evidence_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        growth_score:
          $ref: "#/components/schemas/RatioCatalogValue"
        competition_density:
          $ref: "#/components/schemas/RatioCatalogValue"
        data_availability:
          $ref: "#/components/schemas/RatioCatalogValue"
        reproducibility:
          $ref: "#/components/schemas/RatioCatalogValue"
        missing_signals:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        limitations:
          type: array
          items:
            type: string
            minLength: 1
        formula_version:
          type: string
          minLength: 1
        generated_at:
          type: string
          format: date-time
        evaluated_at:
          type: string
          format: date-time
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        recommended_next_steps:
          type: array
          items:
            type: string
            minLength: 1
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - detail
        - instance
        - request_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          enum:
            - invalid_request_id
            - route_not_found
            - method_not_allowed
            - catalog_not_published
            - resource_not_found
            - invalid_cursor
            - cursor_context_mismatch
            - validation_error
            - internal_error
        detail:
          type: string
          minLength: 1
        instance:
          type: string
          format: uri-reference
        request_id:
          $ref: "#/components/schemas/RequestID"
    PaperType:
      type: string
      enum:
        - research_article
        - review
        - preprint
        - dataset
        - benchmark
    PaperStatus:
      type: string
      enum:
        - active
        - withdrawn
        - retracted
        - rejected
        - superseded
    SourceName:
      type: string
      enum:
        - crossref
        - arxiv
        - openreview
        - s2
        - pubmed
        - pmc
        - openalex
        - springer_nature
        - elsevier
        - manual
    ResearchOpportunityStatus:
      type: string
      enum:
        - worth_pursuing
        - proceed_with_caution
        - not_recommended_now
        - insufficient_evidence
