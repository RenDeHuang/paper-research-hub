        citations_per_day:
          $ref: "#/components/schemas/NumberCatalogValue"
        cohort_percentile:
          $ref: "#/components/schemas/RatioCatalogValue"
        paper:
          $ref: "#/components/schemas/PaperSummary"
    CitationMomentumCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
