        independent_journal_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        independent_team_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
        label:
          type: string
          minLength: 1
        model_family:
          type: string
          minLength: 1
        p_value:
          $ref: "#/components/schemas/NumberCatalogValue"
        recent_count:
          $ref: "#/components/schemas/IntegerCatalogValue"
    EntityMomentumCollection:
      type: object
      additionalProperties: false
      required:
        - analysis
        - items
      properties:
        analysis:
          $ref: "#/components/schemas/AnalysisMetadata"
        items:
          type: array
          items:
            $ref: "#/components/schemas/EntityMomentumItem"
    JournalMetricCategory:
      type: object
      additionalProperties: false
