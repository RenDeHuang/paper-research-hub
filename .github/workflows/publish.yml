name: Publish containers

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release-metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      image-owner: ${{ steps.release.outputs.image-owner }}
      latest: ${{ steps.release.outputs.latest }}
      ref: ${{ steps.release.outputs.ref }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate version tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${RELEASE_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "${tag}" =~ ${semver_pattern} ]]; then
            printf 'Ref %q is not a supported semantic version tag.\n' "${tag}" >&2
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          latest=false
          if [[ "${tag}" != *-* ]]; then
            latest=true
          fi

          {
            printf 'image-owner=%s\n' "${owner}"
            printf 'latest=%s\n' "${latest}"
            printf 'ref=%s\n' "${tag}"
            printf 'tag=%s\n' "${tag}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Verify source
    needs:
      - release-metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-metadata.outputs.ref }}

  containers:
    name: Verify containers
    needs:
      - release-metadata
    uses: ./.github/workflows/container.yml
    with:
      ref: ${{ needs.release-metadata.outputs.ref }}

  publish:
    name: Publish ${{ matrix.name }}
    needs:
      - release-metadata
      - quality
      - containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            image: paper-research-hub-core
            dockerfile: services/core/Dockerfile
            cache-scope: core
          - name: Web
            image: paper-research-hub-web
            dockerfile: apps/web/Dockerfile
            cache-scope: web
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-metadata.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ needs.release-metadata.outputs.image-owner }}/${{ matrix.image }}:${{ needs.release-metadata.outputs.tag }}
            ${{ needs.release-metadata.outputs.latest == 'true' && format('ghcr.io/{0}/{1}:latest', needs.release-metadata.outputs.image-owner, matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}
          provenance: mode=max
          sbom: true
