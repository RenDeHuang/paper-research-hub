name: Containers

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate deployment contract
        run: sh deploy/tests/deploy_contract_test.sh

      - name: Validate Compose models
        run: make compose-config

      - name: Build application images
        run: make compose-build

      - name: Run empty-database smoke test
        run: make smoke
