[project]
name = "paper-hub-api"
version = "0.1.0"
description = "Paper Research Hub API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.scripts]
paper-hub = "paper_hub.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
]

[tool.uv.build-backend]
module-name = "paper_hub"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
