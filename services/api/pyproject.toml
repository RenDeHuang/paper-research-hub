[project]
name = "paper-hub-api"
version = "0.1.0"
description = "Paper Research Hub API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
