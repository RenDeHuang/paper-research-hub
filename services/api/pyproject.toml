[project]
name = "paper-hub-api"
version = "0.1.0"
description = "Paper Research Hub API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "pytest==9.1.1",
]

[tool.uv.build-backend]
module-name = "paper_hub"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
